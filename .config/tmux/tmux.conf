# True color settings
set -g default-terminal "tmux-256color"
set -ag terminal-overrides "*:Tc"
# Undercurl support
set -ag terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Underscore colours
set -ag terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -g prefix C-space
set -g base-index 1
set -g mode-keys vi
set -s escape-time 0
set -g mouse on
set -g history-limit 10000
set -g copy-command 'wl-copy'

bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi Y send-keys -X copy-end-of-line 'wl-copy'

bind k select-pane -U
bind j select-pane -D
bind h select-pane -L
bind l select-pane -R
bind -r	M-k resize-pane -U 5
bind -r M-j resize-pane -D 5
bind -r M-h resize-pane -L 5
bind -r M-l resize-pane -R 5
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

# Style borders
set -g pane-border-style 'bg=default fg=#333333'
set -g pane-active-border-style "bg=default fg=#aaaaaa"

# Style status bar
set -g status-position top
set -g status-style 'bg=default fg=green'
set -g window-status-current-style "fg=cyan" 
set -g message-style "fg=yellow"
set -g destroy-unattached on

# Toggle volatility
bind v run "tmux set destroy-unattached && tmux refresh-client -S"

# Open panes/windows in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
